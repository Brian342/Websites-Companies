<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — ByteWave</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header"><div class="container nav-row"><h1 class="logo">ByteWave<span class="dot">.</span></h1><nav><a href="index.html" class="nav-item">Home</a><a href="projects.html" class="nav-item">Projects</a><a href="team.html" class="nav-item">Team</a><a href="contact.html" class="nav-item active">Contact</a></nav></div></header>
  <main class="container">
    <h2>Contact Us</h2>
    <p class="small">Send us a message and we’ll reply within 2 business days.</p>
    <div class="card">
      <form id="contactForm">
        <label>Name<input id="name" /></label>
        <label>Email<input id="email" type="email"/></label>
        <label>Message<textarea id="message" rows="5"></textarea></label>
        <button class="btn" type="submit">Send</button>
      </form>
      <div style="margin-top:1rem" class="small">Or email us at <a href="mailto:hello@bytewave.example">hello@bytewave.example</a></div>
    </div>
  </main>
  <footer class="site-footer">
    <div class="footer-decor" aria-hidden="true"></div>
    <div class="container footer-grid">
      <div class="footer-brand">
        <h3 class="logo">ByteWave<span class="dot">.</span></h3>
        <p class="small">We build simple, reliable software for modern businesses.</p>
      </div>
      <div class="footer-feedback">
        <h4>Feedback</h4>
        <form id="footerFeedbackForm">
          <input id="fb-email" type="email" placeholder="Your email" required />
          <textarea id="fb-message" rows="2" placeholder="Message"></textarea>
          <button class="btn" type="submit">Send</button>
        </form>
        <div id="fb-response" class="small" style="margin-top:.5rem"></div>
      </div>
      <div class="footer-social">
        <h4>Follow</h4>
        <div class="social-icons">
          <a href="#" aria-label="Twitter" class="social">Twitter</a>
          <a href="#" aria-label="LinkedIn" class="social">LinkedIn</a>
          <a href="#" aria-label="GitHub" class="social">GitHub</a>
        </div>
      </div>
    </div>
    <div class="container footer-bottom">© <span id="year"></span> ByteWave — Built with care • <a href="contact.html">Contact</a></div>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
