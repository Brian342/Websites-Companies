<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CalcIt — Calculator Demo</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style> .calc{max-width:320px;margin:1rem auto}.display{height:56px;border-radius:8px;background:#f4f8ff;padding:0.5rem;font-size:1.2rem;text-align:right;border:1px solid #e6eefb}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}button.calc-btn{padding:12px;border-radius:6px;border:1px solid #dceafe;background:white;font-weight:600}</style>
</head>
<body>
  <header class="site-header"><div class="container nav-row"><h1 class="logo">ByteWave<span class="dot">.</span></h1><nav><a href="index.html" class="nav-item">Home</a><a href="projects.html" class="nav-item active">Projects</a><a href="team.html" class="nav-item">Team</a><a href="contact.html" class="nav-item">Contact</a></nav></div></header>
  <main class="container calc">
    <h2>CalcIt — Calculator</h2>
    <div class="card">
      <div id="display" class="display">0</div>
      <div class="buttons">
        <button class="calc-btn">7</button><button class="calc-btn">8</button><button class="calc-btn">9</button><button class="calc-btn">/</button>
        <button class="calc-btn">4</button><button class="calc-btn">5</button><button class="calc-btn">6</button><button class="calc-btn">*</button>
        <button class="calc-btn">1</button><button class="calc-btn">2</button><button class="calc-btn">3</button><button class="calc-btn">-</button>
        <button class="calc-btn">0</button><button class="calc-btn">.</button><button class="calc-btn">=</button><button class="calc-btn">+</button>
      </div>
    </div>
  </main>
  <footer class="site-footer"><div class="container">© <span id="year"></span> ByteWave — Demo</div></footer>
  <script>
    const display = document.getElementById('display');
    let buffer = '';
    document.querySelectorAll('.calc-btn').forEach(btn=>{btn.addEventListener('click',()=>{const v=btn.textContent; if(v==="="){try{const result = eval(buffer); display.textContent = String(result); buffer = String(result);}catch(e){display.textContent='Error';buffer=''}} else { if(display.textContent==='0' && /\d/.test(v)){display.textContent = v; buffer = v;} else { buffer += v; display.textContent = buffer } }});});
  </script>
</body>
</html>
