{% extends "base.html" %}
{% block title %}Settings{% endblock %}

{% block content %}
  <h1 class="page-title">Settings</h1>
  <p class="page-subtitle">Update your display name. This is the name shown when you're signed in.</p>

  <div class="card settings-section">
    <form method="post">
      <div class="form-group">
        <label for="display_name">Display name</label>
        <input type="text" id="display_name" name="display_name" value="{{ user_name or '' }}" placeholder="Your name" required>
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
  </div>
{% endblock %}
